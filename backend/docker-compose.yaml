version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: tena_ai_db
      POSTGRES_USER: tena
      POSTGRES_PASSWORD: tena_password
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://tena:tena_password@db:5432/tena_ai_db
      - SECRET_KEY
      - FLASK_ENV=production
      - AZURE_OPENAI_KEY
      - AZURE_OPENAI_ENDPOINT
      - AZURE_OPENAI_DEPLOYMENT
      - FRONTEND_URL
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
